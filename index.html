<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTracker - Universo & Franquias</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0a0a0c',
                            800: '#121216',
                            700: '#1a1a20',
                            600: '#262630'
                        },
                        purple: {
                            600: '#7c3aed',
                            500: '#8b5cf6',
                            400: '#a78bfa'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0a0a0c] text-zinc-100 min-h-screen pb-28 selection:bg-purple-600 selection:text-white">

    <!-- Header & Search Bar -->
    <header class="sticky top-0 z-40 bg-[#0a0a0c]/90 backdrop-blur-xl border-b border-zinc-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('explore')">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-600/30">
                    <i class="fa-solid fa-film text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight bg-gradient-to-r from-white via-zinc-200 to-purple-400 bg-clip-text text-transparent">CineTracker</h1>
                    <p class="text-[10px] text-purple-400 font-semibold tracking-wider uppercase">Universo & Franquias BR</p>
                </div>
            </div>

            <!-- Global Search, Raffle & API Key Trigger -->
            <div class="flex items-center gap-2 flex-1 max-w-md">
                <div class="relative flex-1">
                    <i class="fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400 text-sm"></i>
                    <input type="text" id="globalSearchInput" placeholder="Buscar filmes, séries globais ou franquias..." 
                        oninput="handleSearch(this.value)"
                        class="w-full bg-zinc-900/90 border border-zinc-800 rounded-2xl pl-10 pr-4 py-2 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition">
                </div>
                <button onclick="openRaffleQueue()" class="w-9 h-9 rounded-2xl bg-purple-600/20 border border-purple-500/40 flex items-center justify-center text-purple-400 hover:bg-purple-600 hover:text-white transition" title="Sortear da Fila (Assistir)">
                    <i class="fa-solid fa-dice text-xs"></i>
                </button>
                <button onclick="openRaffleGlobal()" class="w-9 h-9 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 hover:bg-indigo-600 hover:text-white transition" title="Roleta Global (Sugerir Novo)">
                    <i class="fa-solid fa-shuffle text-xs"></i>
                </button>
                <button onclick="toggleApiKeyModal()" class="w-9 h-9 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 hover:text-purple-400 hover:border-purple-500/50 transition" title="Configurar TMDb API Key">
                    <i class="fa-solid fa-key text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main id="appContent" class="max-w-7xl mx-auto px-4 py-6">
        <!-- Injetado dinamicamente pelas abas -->
    </main>

    <!-- Bottom Floating Navigation Bar (6 Tabs) -->
    <nav class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 w-[95%] max-w-xl bg-zinc-900/95 backdrop-blur-xl border border-zinc-800/80 rounded-3xl p-1.5 shadow-2xl shadow-black/80 flex items-center justify-around">
        <button onclick="switchTab('explore')" id="nav-explore" class="flex-1 py-2.5 rounded-2xl flex flex-col items-center gap-1 transition text-purple-400 bg-purple-600/20">
            <i class="fa-solid fa-compass text-sm"></i>
            <span class="text-[10px] font-bold tracking-wide">Descobrir</span>
        </button>
        <button onclick="switchTab('pending')" id="nav-pending" class="flex-1 py-2.5 rounded-2xl flex flex-col items-center gap-1 transition text-zinc-400 hover:text-zinc-200">
            <i class="fa-solid fa-tv text-sm"></i>
            <span class="text-[10px] font-semibold tracking-wide">Assistir</span>
        </button>
        <button onclick="switchTab('lists')" id="nav-lists" class="flex-1 py-2.5 rounded-2xl flex flex-col items-center gap-1 transition text-zinc-400 hover:text-zinc-200">
            <i class="fa-solid fa-layer-group text-sm"></i>
            <span class="text-[10px] font-semibold tracking-wide">Listas</span>
        </button>
        <button onclick="switchTab('agenda')" id="nav-agenda" class="flex-1 py-2.5 rounded-2xl flex flex-col items-center gap-1 transition text-zinc-400 hover:text-zinc-200">
            <i class="fa-solid fa-calendar-days text-sm"></i>
            <span class="text-[10px] font-semibold tracking-wide">Agenda</span>
        </button>
        <button onclick="switchTab('watched')" id="nav-watched" class="flex-1 py-2.5 rounded-2xl flex flex-col items-center gap-1 transition text-zinc-400 hover:text-zinc-200">
            <i class="fa-solid fa-circle-check text-sm"></i>
            <span class="text-[10px] font-semibold tracking-wide">Vistos</span>
        </button>
        <button onclick="switchTab('profile')" id="nav-profile" class="flex-1 py-2.5 rounded-2xl flex flex-col items-center gap-1 transition text-zinc-400 hover:text-zinc-200">
            <i class="fa-solid fa-user text-sm"></i>
            <span class="text-[10px] font-semibold tracking-wide">Perfil</span>
        </button>
    </nav>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-20 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Details Modal -->
    <div id="detailsModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 overflow-y-auto">
        <div id="detailsModalContent" class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto relative p-6 shadow-2xl">
            <!-- Dynamic content injected via JS -->
        </div>
    </div>

    <!-- API Key Modal -->
    <div id="apiKeyModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-md w-full p-6 relative">
            <h3 class="text-base font-bold text-zinc-100 mb-2">Chave da API TMDb</h3>
            <p class="text-xs text-zinc-400 mb-3">Insira sua chave de API do The Movie Database (TMDb) se desejar personalizá-la.</p>
            <input type="text" id="apiKeyInput" placeholder="Sua chave aqui..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-xs text-zinc-100 mb-4 focus:outline-none focus:border-purple-500">
            <div class="flex justify-end gap-2">
                <button onclick="toggleApiKeyModal()" class="px-4 py-2 rounded-xl text-xs bg-zinc-800 text-zinc-300 hover:bg-zinc-700">Cancelar</button>
                <button onclick="saveApiKey()" class="px-4 py-2 rounded-xl text-xs bg-purple-600 text-white font-semibold hover:bg-purple-500">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Sorteador Modal -->
    <div id="raffleModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-md w-full p-6 relative flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <h3 class="text-base font-bold text-zinc-100 flex items-center gap-2" id="raffleTitle"><i class="fa-solid fa-dice text-purple-400"></i> Sorteador</h3>
                <button onclick="closeRaffleModal()" class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-300 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="raffleBody" class="space-y-4"></div>
        </div>
    </div>

    <!-- AI List Generation Modal -->
    <div id="aiListModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-md w-full p-6 relative flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <h3 class="text-base font-bold text-zinc-100 flex items-center gap-2"><i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i> Gerar Lista com IA</h3>
                <button onclick="closeAiListModal()" class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-300 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-zinc-400">Descreva o tema da lista ou solicite sugestões de filmes, séries e animes (Ex: "Melhores animes de ação dos anos 90").</p>
            <textarea id="aiPromptInput" rows="3" placeholder="Ex: Filmes de terror psicológico..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-xs text-zinc-100 focus:outline-none focus:border-purple-500 resize-none"></textarea>
            <button onclick="generateAiList()" id="aiGenerateBtn" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-lg hover:opacity-90 transition">
                <i class="fa-solid fa-sparkles"></i> Criar Lista Inteligente
            </button>
        </div>
    </div>

    <script>
        const DEFAULT_API_KEY = 'ea85f1e683ea3b8807a2fc5b1ec4b8ca';
        let state = {
            apiKey: localStorage.getItem('cinetracker_apikey') || DEFAULT_API_KEY,
            currentTab: 'explore',
            exploreType: 'all',
            searchQuery: '',
            searchResults: [],
            pending: JSON.parse(localStorage.getItem('cinetracker_pending') || '[]'),
            watched: JSON.parse(localStorage.getItem('cinetracker_watched') || '[]'),
            lists: JSON.parse(localStorage.getItem('cinetracker_lists') || '[]'),
            suspended: JSON.parse(localStorage.getItem('cinetracker_suspended') || '{}'),
            seriesProgress: JSON.parse(localStorage.getItem('cinetracker_series_progress') || '{}'),
            profileSubTab: 'stats'
        };

        const itemsCache = new Map();
        let currentDetailItem = null;
        let searchDebounceTimeout = null;
        let agendaFilterState = 'all';

        function saveState() {
            localStorage.setItem('cinetracker_pending', JSON.stringify(state.pending));
            localStorage.setItem('cinetracker_watched', JSON.stringify(state.watched));
            localStorage.setItem('cinetracker_lists', JSON.stringify(state.lists));
            localStorage.setItem('cinetracker_suspended', JSON.stringify(state.suspended));
            localStorage.setItem('cinetracker_series_progress', JSON.stringify(state.seriesProgress));
        }

        function getActiveApiKey() { return state.apiKey || DEFAULT_API_KEY; }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-2xl text-xs font-bold shadow-2xl backdrop-blur-xl border transition duration-300 pointer-events-auto flex items-center gap-2 ${
                type === 'success' ? 'bg-emerald-950/90 text-emerald-300 border-emerald-500/40' : 'bg-purple-950/90 text-purple-300 border-purple-500/40'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-bell'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function formatPosterUrl(path) { return path ? `https://image.tmdb.org/t/p/w500${path}` : 'https://placehold.co/500x750/1a1a20/a78bfa?text=Sem+Capa'; }
        function formatBackdropUrl(path) { return path ? `https://image.tmdb.org/t/p/original${path}` : ''; }

        function toggleApiKeyModal() {
            const m = document.getElementById('apiKeyModal');
            if (m) { m.classList.toggle('hidden'); m.classList.toggle('flex'); }
            const input = document.getElementById('apiKeyInput');
            if (input) input.value = state.apiKey;
        }

        function saveApiKey() {
            const val = document.getElementById('apiKeyInput').value.trim();
            if (val) {
                state.apiKey = val;
                localStorage.setItem('cinetracker_apikey', val);
                toggleApiKeyModal();
                showToast('Chave API atualizada!', 'success');
                switchTab(state.currentTab);
            }
        }

        function switchTab(tab) {
            state.currentTab = tab;
            ['explore', 'pending', 'lists', 'agenda', 'watched', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    btn.className = t === tab ? 'flex-1 py-2.5 rounded-2xl flex flex-col items-center gap-1 transition text-purple-400 bg-purple-600/20' : 'flex-1 py-2.5 rounded-2xl flex flex-col items-center gap-1 transition text-zinc-400 hover:text-zinc-200';
                }
            });

            if (tab === 'explore') {
                state.searchQuery = '';
                const searchInput = document.getElementById('globalSearchInput');
                if (searchInput) searchInput.value = '';
            }

            const content = document.getElementById('appContent');
            if (!content) return;
            content.innerHTML = '<div class="flex justify-center py-20"><i class="fa-solid fa-spinner fa-spin text-purple-500 text-3xl"></i></div>';

            if (tab === 'explore') renderExplore();
            else if (tab === 'pending') renderPendingQueue();
            else if (tab === 'lists') renderLists();
            else if (tab === 'agenda') renderAgenda();
            else if (tab === 'watched') renderWatched();
            else if (tab === 'profile') renderProfile();
        }

        // --- ABA 1: DESCOBRIR ---
        async function renderExplore() {
            const content = document.getElementById('appContent');
            if (!content) return;
            content.innerHTML = `
                <div class="space-y-6">
                    <div id="searchResultsContainer" class="hidden space-y-4 mb-6">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-extrabold text-zinc-100 flex items-center gap-2"><i class="fa-solid fa-search text-purple-400"></i> Resultados da Busca</h3>
                            <button onclick="clearSearch()" class="text-xs text-zinc-400 hover:text-white underline">Limpar busca</button>
                        </div>
                        <div id="searchResultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="openRaffleQueue()" class="p-3 bg-gradient-to-r from-purple-900/60 to-indigo-900/60 border border-purple-500/30 rounded-2xl text-left hover:border-purple-400 transition group flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-purple-600/30 border border-purple-500/40 flex items-center justify-center text-purple-300 text-lg group-hover:scale-110 transition">
                                <i class="fa-solid fa-dice"></i>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-zinc-100">Sortear da Fila</h4>
                                <p class="text-[10px] text-zinc-400">O que assistir hoje?</p>
                            </div>
                        </button>
                        <button onclick="openRaffleGlobal()" class="p-3 bg-gradient-to-r from-indigo-900/60 to-purple-900/60 border border-indigo-500/30 rounded-2xl text-left hover:border-indigo-400 transition group flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-300 text-lg group-hover:scale-110 transition">
                                <i class="fa-solid fa-shuffle"></i>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-zinc-100">Roleta Global</h4>
                                <p class="text-[10px] text-zinc-400">Sugerir algo novo</p>
                            </div>
                        </button>
                    </div>

                    <div class="flex items-center gap-2 bg-zinc-900/60 p-3 rounded-2xl border border-zinc-800">
                        <button onclick="filterExploreType('all')" class="px-4 py-1.5 rounded-xl text-xs font-bold transition ${state.exploreType === 'all' ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/30' : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'}">Tudo</button>
                        <button onclick="filterExploreType('movie')" class="px-4 py-1.5 rounded-xl text-xs font-bold transition ${state.exploreType === 'movie' ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/30' : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'}">Filmes</button>
                        <button onclick="filterExploreType('tv')" class="px-4 py-1.5 rounded-xl text-xs font-bold transition ${state.exploreType === 'tv' ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/30' : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'}">Séries</button>
                    </div>

                    <div id="exploreFeeds" class="space-y-8">
                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <h3 class="text-sm font-extrabold text-zinc-100 flex items-center gap-2"><i class="fa-solid fa-fire text-amber-500"></i> Em Alta na Semana</h3>
                                <div class="flex gap-1.5">
                                    <button onclick="scrollFeed('feedTrending', -320)" class="w-7 h-7 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-300 hover:text-white transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                                    <button onclick="scrollFeed('feedTrending', 320)" class="w-7 h-7 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-300 hover:text-white transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                                </div>
                            </div>
                            <div id="feedTrending" class="flex gap-4 overflow-x-auto no-scrollbar scroll-smooth pb-2 pt-1 w-full max-w-full"></div>
                        </div>

                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <h3 class="text-sm font-extrabold text-zinc-100 flex items-center gap-2"><i class="fa-solid fa-star text-purple-400"></i> Top 10 Sucessos não vistos</h3>
                                <div class="flex gap-1.5">
                                    <button onclick="scrollFeed('feedUnseen', -320)" class="w-7 h-7 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-300 hover:text-white transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                                    <button onclick="scrollFeed('feedUnseen', 320)" class="w-7 h-7 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-300 hover:text-white transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                                </div>
                            </div>
                            <div id="feedUnseen" class="flex gap-4 overflow-x-auto no-scrollbar scroll-smooth pb-2 pt-1 w-full max-w-full"></div>
                        </div>

                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <h3 class="text-sm font-extrabold text-zinc-100 flex items-center gap-2"><i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i> Indicações diferentes</h3>
                                <div class="flex gap-1.5">
                                    <button onclick="scrollFeed('feedRecommended', -320)" class="w-7 h-7 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-300 hover:text-white transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                                    <button onclick="scrollFeed('feedRecommended', 320)" class="w-7 h-7 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-300 hover:text-white transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                                </div>
                            </div>
                            <div id="feedRecommended" class="flex gap-4 overflow-x-auto no-scrollbar scroll-smooth pb-2 pt-1 w-full max-w-full"></div>
                        </div>

                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <h3 class="text-sm font-extrabold text-zinc-100 flex items-center gap-2"><i class="fa-solid fa-skull text-rose-500"></i> Filmes e Séries Duvidosos</h3>
                                <div class="flex gap-1.5">
                                    <button onclick="scrollFeed('feedDoubtful', -320)" class="w-7 h-7 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-300 hover:text-white transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                                    <button onclick="scrollFeed('feedDoubtful', 320)" class="w-7 h-7 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-300 hover:text-white transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                                </div>
                            </div>
                            <div id="feedDoubtful" class="flex gap-4 overflow-x-auto no-scrollbar scroll-smooth pb-2 pt-1 w-full max-w-full"></div>
                        </div>
                    </div>
                </div>
            `;
            await loadExploreFeeds();
            if (state.searchQuery) {
                handleSearch(state.searchQuery);
            }
        }

        function filterExploreType(type) {
            state.exploreType = type;
            renderExplore();
        }

        function scrollFeed(feedId, distance) {
            const el = document.getElementById(feedId);
            if (el) el.scrollBy({ left: distance, behavior: 'smooth' });
        }

        function handleSearch(query) {
            state.searchQuery = query;
            if (state.currentTab !== 'explore') {
                switchTab('explore');
                return;
            }

            const container = document.getElementById('searchResultsContainer');
            const grid = document.getElementById('searchResultsGrid');
            if (!container || !grid) return;

            if (!query || query.trim().length === 0) {
                container.classList.add('hidden');
                grid.innerHTML = '';
                return;
            }

            container.classList.remove('hidden');
            grid.innerHTML = '<div class="col-span-full flex justify-center py-6"><i class="fa-solid fa-spinner fa-spin text-purple-500 text-xl"></i></div>';

            clearTimeout(searchDebounceTimeout);
            searchDebounceTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${getActiveApiKey()}&language=pt-BR&query=${encodeURIComponent(query)}&page=1`);
                    const data = await res.json();
                    const results = (data.results || []).filter(item => item.media_type === 'movie' || item.media_type === 'tv');
                    state.searchResults = results;

                    if (!results.length) {
                        grid.innerHTML = '<p class="col-span-full text-xs text-zinc-500 text-center py-4">Nenhum resultado encontrado.</p>';
                        return;
                    }

                    grid.innerHTML = results.map(renderCard).join('');
                } catch(e) {
                    grid.innerHTML = '<p class="col-span-full text-xs text-rose-500 text-center py-4">Erro ao realizar busca.</p>';
                }
            }, 300);
        }

        function clearSearch() {
            state.searchQuery = '';
            const input = document.getElementById('globalSearchInput');
            if (input) input.value = '';
            const container = document.getElementById('searchResultsContainer');
            if (container) container.classList.add('hidden');
        }

        async function fetchCategoryItems(category) {
            const apiKey = getActiveApiKey();
            const type = state.exploreType;
            const now = Date.now();

            const filterItems = (items, defaultType = 'movie') => {
                const seenIds = new Set();
                return (items || []).filter(i => {
                    if (!i || !i.id) return false;
                    const id = Number(i.id);
                    if (seenIds.has(id)) return false;
                    seenIds.add(id);
                    if (state.suspended[id]) {
                        const expire = typeof state.suspended[id] === 'object' ? state.suspended[id].expire : state.suspended[id];
                        if (expire > now) return false;
                    }
                    const isWatched = state.watched.some(w => Number(w.id) === id || Number(w.tvId) === id);
                    const isInQueue = state.pending.some(p => Number(p.id) === id);
                    if (isWatched || isInQueue) return false;

                    return true;
                }).map(i => {
                    const resolvedType = i.media_type || defaultType;
                    itemsCache.set(i.id, { ...i, media_type: resolvedType });
                    return { ...i, media_type: resolvedType };
                });
            };

            try {
                if (category === 'trending') {
                    if (type === 'movie') {
                        const res = await fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key=${apiKey}&language=pt-BR`);
                        const data = await res.json();
                        return filterItems(data?.results, 'movie');
                    } else if (type === 'tv') {
                        const res = await fetch(`https://api.themoviedb.org/3/trending/tv/week?api_key=${apiKey}&language=pt-BR`);
                        const data = await res.json();
                        return filterItems(data?.results, 'tv');
                    } else {
                        const res = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${apiKey}&language=pt-BR`);
                        const data = await res.json();
                        const results = (data?.results || []).filter(i => i && (i.media_type === 'movie' || i.media_type === 'tv'));
                        return filterItems(results, 'movie');
                    }
                } else if (category === 'unseen') {
                    if (type === 'all') {
                        const [mRes, tRes] = await Promise.all([
                            fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${apiKey}&language=pt-BR&sort_by=vote_count.desc&vote_average.gte=7.0&page=1`),
                            fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${apiKey}&language=pt-BR&sort_by=vote_count.desc&vote_average.gte=7.0&page=1`)
                        ]);
                        const mData = await mRes.json();
                        const tData = await tRes.json();
                        const combined = [
                            ...(mData?.results || []).map(m => ({ ...m, media_type: 'movie' })),
                            ...(tData?.results || []).map(t => ({ ...t, media_type: 'tv' }))
                        ].sort((a,b) => (b.vote_count || 0) - (a.vote_count || 0));
                        return filterItems(combined, 'movie');
                    } else {
                        const endpoint = type === 'tv' ? 'tv' : 'movie';
                        const res = await fetch(`https://api.themoviedb.org/3/discover/${endpoint}?api_key=${apiKey}&language=pt-BR&sort_by=vote_count.desc&vote_average.gte=7.0&page=1`);
                        const data = await res.json();
                        return filterItems(data?.results, endpoint);
                    }
                } else if (category === 'recommended') {
                    const endpoint = type === 'all' ? 'movie' : (type === 'tv' ? 'tv' : 'movie');
                    const res = await fetch(`https://api.themoviedb.org/3/discover/${endpoint}?api_key=${apiKey}&language=pt-BR&sort_by=popularity.desc&page=${Math.floor(Math.random() * 5) + 1}`);
                    const data = await res.json();
                    return filterItems(data?.results, endpoint);
                } else if (category === 'doubtful') {
                    if (type === 'all') {
                        const [mRes, tRes] = await Promise.all([
                            fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${apiKey}&language=pt-BR&vote_average.gte=0.1&vote_average.lte=5.0&vote_count.gte=10&sort_by=popularity.desc`),
                            fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${apiKey}&language=pt-BR&vote_average.gte=0.1&vote_average.lte=5.0&vote_count.gte=10&sort_by=popularity.desc`)
                        ]);
                        const mData = await mRes.json();
                        const tData = await tRes.json();
                        const combined = [
                            ...(mData?.results || []).map(m => ({ ...m, media_type: 'movie' })),
                            ...(tData?.results || []).map(t => ({ ...t, media_type: 'tv' }))
                        ];
                        return filterItems(combined, 'movie');
                    } else {
                        const endpoint = type === 'tv' ? 'tv' : 'movie';
                        const res = await fetch(`https://api.themoviedb.org/3/discover/${endpoint}?api_key=${apiKey}&language=pt-BR&vote_average.gte=0.1&vote_average.lte=5.0&vote_count.gte=10&sort_by=popularity.desc`);
                        const data = await res.json();
                        return filterItems(data?.results, endpoint);
                    }
                }
            } catch (e) {
                return [];
            }
            return [];
        }

            const mediaType = item.media_type || 'movie';
            const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';

            const inQueue = state.pending.some(i => Number(i.id) === Number(item.id));

            return `
                <div class="flex-none w-36 md:w-44 bg-zinc-900/80 rounded-2xl overflow-hidden border border-zinc-800 flex flex-col group hover:border-purple-500/50 transition cursor-pointer relative shrink-0" onclick="openDetailsModal(${item.id}, '${mediaType}')">

                        <div class="absolute top-2 right-2 bg-black/70 backdrop-blur-md px-2 py-0.5 rounded-full text-xs font-bold text-amber-400 border border-amber-500/30">★ ${rating}</div>
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-[10px] font-semibold uppercase text-purple-400">${mediaType === 'movie' ? 'Filme' : 'Série'}</span>

        async function loadExploreFeeds() {
            const feedTrending = document.getElementById('feedTrending');
            const feedUnseen = document.getElementById('feedUnseen');
            const feedRecommended = document.getElementById('feedRecommended');
            const feedDoubtful = document.getElementById('feedDoubtful');

            if (!feedTrending) return;

            feedTrending.innerHTML = '<div class="flex justify-center w-full py-6"><i class="fa-solid fa-spinner fa-spin text-purple-500 text-xl"></i></div>';
            feedUnseen.innerHTML = '<div class="flex justify-center w-full py-6"><i class="fa-solid fa-spinner fa-spin text-purple-500 text-xl"></i></div>';
            feedRecommended.innerHTML = '<div class="flex justify-center w-full py-6"><i class="fa-solid fa-spinner fa-spin text-purple-500 text-xl"></i></div>';
            if (feedDoubtful) feedDoubtful.innerHTML = '<div class="flex justify-center w-full py-6"><i class="fa-solid fa-spinner fa-spin text-purple-500 text-xl"></i></div>';

            const [trending, unseen, recommended, doubtful] = await Promise.all([
                fetchCategoryItems('trending'),
                fetchCategoryItems('unseen'),
                fetchCategoryItems('recommended'),
                fetchCategoryItems('doubtful')
            ]);

            feedTrending.innerHTML = trending.length ? trending.map(renderCard).join('') : '<p class="text-xs text-zinc-500 py-4 w-full text-center">Nenhum encontrado.</p>';
            feedUnseen.innerHTML = unseen.length ? unseen.map(renderCard).join('') : '<p class="text-xs text-zinc-500 py-4 w-full text-center">Nenhum encontrado.</p>';
            feedRecommended.innerHTML = recommended.length ? recommended.map(renderCard).join('') : '<p class="text-xs text-zinc-500 py-4 w-full text-center">Nenhum encontrado.</p>';
            if (feedDoubtful) feedDoubtful.innerHTML = doubtful.length ? doubtful.map(renderCard).join('') : '<p class="text-xs text-zinc-500 py-4 w-full text-center">Nenhum encontrado.</p>';
        }

        function snoozeItem(id) {
            const item = itemsCache.get(id) || {};
            state.suspended[id] = { expire: Date.now() + (30 * 24 * 60 * 60 * 1000), title: item.title || item.name || '', poster: item.poster_path || '' };
            saveState();
            showToast('Título suspenso por 30 dias.', 'info');
            if (state.currentTab === 'explore') loadExploreFeeds();
        }

            if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }

        // --- ABA 2: ASSISTIR (Com transição automática entre temporadas) ---
        async function renderPendingQueue() {
            const content = document.getElementById('appContent');
            if (!content) return;

            if (!state.pending.length) {
                content.innerHTML = `
                    <div class="text-center py-20 space-y-3">
                        <i class="fa-solid fa-tv text-4xl text-zinc-700"></i>
                        <h3 class="text-base font-bold text-zinc-300">Sua Fila está Vazia</h3>
                        <p class="text-xs text-zinc-500">Adicione filmes e séries na aba Descobrir para acompanhar aqui.</p>
                    </div>
                `;
                return;
            }

            const collectionsMap = new Map();
            const standaloneItems = [];

            for (const item of state.pending) {
                if (item.collection_id && item.collection_name) {
                    if (!collectionsMap.has(item.collection_id)) {
                        collectionsMap.set(item.collection_id, { name: item.collection_name, items: [] });
                    }
                    if (!collectionsMap.get(item.collection_id).items.some(i => Number(i.id) === Number(item.id))) {
                        collectionsMap.get(item.collection_id).items.push(item);
                    }
                } else if (item.belongs_to_collection && item.belongs_to_collection.id) {
                    const cid = item.belongs_to_collection.id;
                    const cname = item.belongs_to_collection.name;
                    if (!collectionsMap.has(cid)) {
                        collectionsMap.set(cid, { name: cname, items: [] });
                        await ensureFullCollection(cid);
                    }
                } else {
                    standaloneItems.push(item);
                }
            }

            let html = `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-lg font-extrabold text-zinc-100 flex items-center gap-2"><i class="fa-solid fa-tv text-purple-400"></i> Assistir</h2>
                            <p class="text-xs text-zinc-400">Acompanhe seus episódios e franquias em andamento</p>
                        </div>
                        <span class="text-xs bg-purple-600/20 text-purple-300 px-3 py-1 rounded-full font-bold border border-purple-500/30">${state.pending.length} na fila</span>
                    </div>
                    <div class="space-y-3">
            `;

            for (const [collId, coll] of collectionsMap.entries()) {
                if (!coll.items || coll.items.length === 0) {
                    await ensureFullCollection(collId);
                }
                const parts = (coll.items || []).sort((a,b) => new Date(a.release_date || '9999') - new Date(b.release_date || '9999'));
                const totalParts = parts.length;
                const watchedParts = parts.filter(p => state.watched.some(w => Number(w.id) === Number(p.id))).length;
                
                const nextPart = parts.find(p => !state.watched.some(w => Number(w.id) === Number(p.id))) || parts[0];
                const pct = totalParts > 0 ? Math.round((watchedParts / totalParts) * 100) : 0;

                if (nextPart) {
                    html += `
                        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex items-center justify-between gap-4 hover:border-purple-500/50 transition">
                            <div class="flex items-center gap-4 cursor-pointer flex-1" onclick="openDetailsModal(${nextPart.id}, 'movie')">
                                <img src="${formatPosterUrl(nextPart.poster_path)}" class="w-14 h-20 object-cover rounded-xl shadow-md shrink-0">
                                <div class="space-y-1 flex-1">
                                    <h4 class="text-sm font-extrabold text-zinc-100">${coll.name}</h4>
                                    <p class="text-xs font-bold text-purple-400">Próximo: ${nextPart.title}</p>
                                    <p class="text-[11px] text-zinc-400">${watchedParts}/${totalParts} assistidos</p>
                                    <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden mt-1 max-w-xs">
                                        <div class="h-full bg-purple-500" style="width: ${pct}%"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="markWatchedDirect(${nextPart.id}, 'movie')" class="w-10 h-10 rounded-full bg-zinc-800 hover:bg-emerald-600/30 hover:text-emerald-300 border border-zinc-700 flex items-center justify-center text-zinc-300 transition" title="Marcar próximo visto">
                                    <i class="fa-solid fa-check text-sm"></i>
                                </button>
                                <button onclick="confirmRemoveFranchise('${collId}', '${coll.name.replace(/'/g, "\\'")}')" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-rose-400 flex items-center justify-center transition" title="Remover Franquia">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }
            }

            for (const item of standaloneItems) {
                const title = item.title || item.name || 'Sem Título';
                const poster = formatPosterUrl(item.poster_path);
                const mediaType = item.media_type || 'movie';

                if (mediaType === 'tv') {
                    if (!state.seriesProgress[item.id]) {
                        state.seriesProgress[item.id] = { watchedEpisodes: {}, currentSeason: 1 };
                    }
                    const prog = state.seriesProgress[item.id];
                    const watchedCount = Object.keys(prog.watchedEpisodes).length;
                    const totalEps = item.number_of_episodes || 50;
                    const pct = Math.min(100, Math.round((watchedCount / totalEps) * 100));

                    let nextEpText = "Acompanhar Temporadas & Episódios";
                    let nextSeasonNum = prog.currentSeason || 1;
                    let nextEpNum = 1;
                    try {
                        const seasonsList = item.seasons ? item.seasons.filter(s => s.season_number > 0) : [];
                        let foundNext = false;
                        
                        const currentSeasonIndex = seasonsList.findIndex(s => s.season_number === (prog.currentSeason || 1));
                        const seasonsToCheck = currentSeasonIndex >= 0 ? seasonsList.slice(currentSeasonIndex) : seasonsList;

                        for (const seasonObj of seasonsToCheck) {
                            const sNum = seasonObj.season_number;
                            const sRes = await fetch(`https://api.themoviedb.org/3/tv/${item.id}/season/${sNum}?api_key=${getActiveApiKey()}&language=pt-BR`);
                            if (sRes.ok) {
                                const sData = await sRes.json();
                                const nextEp = (sData.episodes || []).find(e => !prog.watchedEpisodes[`${sNum}_${e.episode_number}`]);
                                if (nextEp) {
                                    nextSeasonNum = sNum;
                                    nextEpNum = nextEp.episode_number;
                                    prog.currentSeason = sNum;
                                    nextEpText = `Próximo: T${sNum}:E${nextEp.episode_number} – ${nextEp.name}`;
                                    foundNext = true;
                                    break;
                                }
                            }
                        }
                        if (!foundNext) {
                            nextEpText = "Todos os episódios assistidos!";
                        }
                    } catch(e) {}

                    html += `
                        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex items-center justify-between gap-4 hover:border-purple-500/50 transition">
                            <div class="flex items-center gap-4 cursor-pointer flex-1" onclick="openDetailsModal(${item.id}, 'tv')">
                                <img src="${poster}" class="w-14 h-20 object-cover rounded-xl shadow-md shrink-0">
                                <div class="space-y-1 flex-1">
                                    <h4 class="text-sm font-extrabold text-zinc-100">${title}</h4>
                                    <p class="text-xs font-bold text-purple-400">${nextEpText}</p>
                                    <p class="text-[11px] text-zinc-400">${watchedCount}/${totalEps} episódios assistidos</p>
                                    <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden mt-1 max-w-xs">
                                        <div class="h-full bg-purple-500" style="width: ${pct}%"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="markNextSeriesEpisodeDirect(${item.id}, ${nextSeasonNum}, ${nextEpNum})" class="w-10 h-10 rounded-full bg-zinc-800 hover:bg-emerald-600/30 hover:text-emerald-300 border border-zinc-700 flex items-center justify-center text-zinc-300 transition" title="Marcar próximo episódio visto">
                                    <i class="fa-solid fa-check text-sm"></i>
                                </button>
                                <button onclick="confirmRemoveQueueItem(${item.id}, 'tv')" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-rose-400 flex items-center justify-center transition" title="Remover">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex items-center justify-between gap-4 hover:border-purple-500/50 transition">
                            <div class="flex items-center gap-4 cursor-pointer flex-1" onclick="openDetailsModal(${item.id}, 'movie')">
                                <img src="${poster}" class="w-14 h-20 object-cover rounded-xl shadow-md shrink-0">
                                <div class="space-y-1 flex-1">
                                    <h4 class="text-sm font-extrabold text-zinc-100">${title}</h4>
                                    <p class="text-xs font-bold text-purple-400">Filme pendente</p>
                                    <p class="text-[11px] text-zinc-400">${(item.release_date || '').substring(0,4)}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="markWatchedDirect(${item.id}, 'movie')" class="w-10 h-10 rounded-full bg-zinc-800 hover:bg-emerald-600/30 hover:text-emerald-300 border border-zinc-700 flex items-center justify-center text-zinc-300 transition" title="Marcar Visto">
                                    <i class="fa-solid fa-check text-sm"></i>
                                </button>
                                <button onclick="confirmRemoveQueueItem(${item.id}, 'movie')" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-rose-400 flex items-center justify-center transition" title="Remover">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }
            }

            html += `</div></div>`;
            content.innerHTML = html;
        }

        async function ensureFullCollection(collId) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/collection/${collId}?api_key=${getActiveApiKey()}&language=pt-BR`);
                if (!res.ok) return;
                const collData = await res.json();
                const parts = (collData.parts || []).sort((a,b) => new Date(a.release_date || '9999') - new Date(b.release_date || '9999'));
                parts.forEach(part => {
                    if (!state.pending.some(p => Number(p.id) === Number(part.id))) {
                        state.pending.push({

        function executeRemoveQueueItem(id, mediaType) {
            const removeFromHistory = document.getElementById('removeItemHistoryCheck')?.checked;
            state.pending = state.pending.filter(p => Number(p.id) !== Number(id));

            if (mediaType === 'tv') {
                state.watched = state.watched.filter(w => Number(w.tvId) !== Number(id) && !String(w.id).startsWith(`${id}_s`));
                delete state.seriesProgress[id];
            } else if (removeFromHistory) {
                state.watched = state.watched.filter(w => Number(w.id) !== Number(id));
            }

            saveState();
            closeRaffleModal();
            renderPendingQueue();
            showToast('Removido da fila e do histórico.', 'info');

        async function togglePendingItemExplicit(id, mediaType) {
            const index = state.pending.findIndex(i => Number(i.id) === Number(id));
            const cardBtn = document.querySelector(`[data-pending-id="${id}"]`);

            if (index > -1) {
                state.pending.splice(index, 1);
                showToast('Removido da fila.', 'info');
                saveState();
                if (cardBtn) {
                    cardBtn.className = "mt-3 w-full py-1.5 px-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1 bg-purple-600/20 text-purple-300 hover:bg-purple-600 hover:text-white border border-purple-500/30";
                    cardBtn.innerHTML = "+ Adicionar";
                }
                if (state.currentTab === 'pending') renderPendingQueue();
                closeDetailsModal();
            } else {
                try {
                    const res = await fetch(`https://api.themoviedb.org/3/${mediaType}/${id}?api_key=${getActiveApiKey()}&language=pt-BR`);
                    const detail = await res.json();
                    
                    if (mediaType === 'movie' && detail.belongs_to_collection) {
                        const collId = detail.belongs_to_collection.id;
                        const collRes = await fetch(`https://api.themoviedb.org/3/collection/${collId}?api_key=${getActiveApiKey()}&language=pt-BR`);
                        if (collRes.ok) {
                            const collData = await collRes.json();
                            const parts = (collData.parts || []).sort((a,b) => new Date(a.release_date || '9999') - new Date(b.release_date || '9999'));
                            parts.forEach(part => {
                                if (!state.pending.some(p => Number(p.id) === Number(part.id))) {
                                    state.pending.push({
                                        ...part,
                                        media_type: 'movie',
                                        collection_name: collData.name,
                                        collection_id: collData.id
                                    });
                                }
                            });
                            showToast(`Franquia "${collData.name}" adicionada!`, 'success');
                        }
                    } else {
                        state.pending.push({ ...detail, media_type: mediaType });
                        showToast('Adicionado à fila!', 'success');
                    }

                    saveState();
                    if (cardBtn) {
                        cardBtn.className = "mt-3 w-full py-1.5 px-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1 bg-emerald-600/20 text-emerald-400 border border-emerald-500/40";
                        cardBtn.innerHTML = "✓ Na Fila";
                    }
                    if (state.currentTab === 'pending') renderPendingQueue();
                    closeDetailsModal();
                } catch (e) {
                    showToast('Erro ao adicionar.', 'error');
                }

        async function generateAiList() {
            const promptInput = document.getElementById('aiPromptInput').value.trim();
            if (!promptInput) { showToast('Digite um tema!', 'info'); return; }
            const btn = document.getElementById('aiGenerateBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Gerando...';
            btn.disabled = true;

            try {
                const systemPrompt = "Especialista em cinema, TV e animes. Crie uma lista temática de recomendações. Retorne apenas JSON válido: { listName: string, description: string, items: Array<{ title: string, year: string, type: 'movie'|'tv' }> }";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`;
                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptInput }] }], systemInstruction: { parts: [{ text: systemPrompt }] }, generationConfig: { responseMimeType: "application/json" } })
                });
                const result = await res.json();
                const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (jsonText) {
                    const parsed = JSON.parse(jsonText);
                    state.lists.push({ name: parsed.listName || promptInput, description: parsed.description || '', items: parsed.items || [], isAi: true });
                    saveState();
                    closeAiListModal();
                    showToast('Lista gerada por IA!', 'success');
                    renderLists();
                }
            } catch (e) {
                showToast('Erro ao gerar com IA.', 'error');
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-sparkles"></i> Criar Lista Inteligente';
                btn.disabled = false;
            }
        }

        async function loadAgendaItems() {
            const agendaFeed = document.getElementById('agendaFeed');
            if (!agendaFeed) return;
            agendaFeed.innerHTML = '<div class="flex justify-center py-10"><i class="fa-solid fa-spinner fa-spin text-purple-500 text-2xl"></i></div>';

            try {
                const apiKey = getActiveApiKey();
                const now = new Date();
                const pastDate = new Date();
                pastDate.setFullYear(now.getFullYear() - 1);
                const futureDate = new Date();
                futureDate.setFullYear(now.getFullYear() + 2);

                const pastStr = pastDate.toISOString().split('T')[0];
                const nowStr = now.toISOString().split('T')[0];
                const futureStr = futureDate.toISOString().split('T')[0];

                const [upcomingRes, pastRes, upcomingTvRes] = await Promise.all([
                    fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${apiKey}&language=pt-BR&region=BR&primary_release_date.gte=${nowStr}&primary_release_date.lte=${futureStr}&sort_by=popularity.desc`),
                    fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${apiKey}&language=pt-BR&region=BR&primary_release_date.gte=${pastStr}&primary_release_date.lte=${nowStr}&sort_by=popularity.desc`),
                    fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${apiKey}&language=pt-BR&first_air_date.gte=${nowStr}&first_air_date.lte=${futureStr}&sort_by=popularity.desc`)
                ]);

                const upData = await upcomingRes.json();
                const pastData = await pastRes.json();
                const upTvData = await upcomingTvRes.json();

                let items = [
                    ...(upData.results || []).map(i => ({ ...i, media_type: 'movie', agenda_category: 'upcoming' })),
                    ...(pastData.results || []).map(i => ({ ...i, media_type: 'movie', agenda_category: 'past12m' })),
                    ...(upTvData.results || []).map(i => ({ ...i, title: i.name, release_date: i.first_air_date, media_type: 'tv', agenda_category: 'upcoming' }))
                ];

                const filtered = [];
                for (const item of items) {
                    if (!item.release_date || !item.poster_path) continue;
                    if (agendaFilterState === 'upcoming' && item.agenda_category !== 'upcoming') continue;
                    if (agendaFilterState === 'past12m' && item.agenda_category !== 'past12m') continue;

                    filtered.push(item);
                }

                filtered.sort((a,b) => new Date(a.release_date || '') - new Date(b.release_date || ''));

                agendaFeed.innerHTML = filtered.length ? filtered.map(item => {
                    const isUpcoming = item.agenda_category === 'upcoming';
                    return `
                        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex items-center justify-between gap-4 cursor-pointer hover:border-purple-500/50 transition" onclick="openDetailsModal(${item.id}, '${item.media_type || 'movie'}')">
                            <div class="flex items-center gap-3">
                                <img src="${formatPosterUrl(item.poster_path)}" class="w-12 h-16 object-cover rounded-xl">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="px-2 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider ${isUpcoming ? 'bg-amber-600/30 text-amber-300' : 'bg-purple-600/20 text-purple-300'}">
                                            ${isUpcoming ? 'Em Breve' : 'Lançado'}
                                        </span>
                                        <span class="text-xs text-amber-400 font-bold">★ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}</span>
                                    </div>
                                    <h4 class="text-sm font-bold text-zinc-100 mt-1">${item.title}</h4>
                                    <p class="text-xs text-zinc-400">Data: <b class="text-zinc-200">${item.release_date}</b></p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-zinc-600 text-xs mr-2"></i>
                        </div>
                    `;
                }).join('') : '<p class="text-xs text-zinc-500 text-center py-6">Nenhum lançamento encontrado para este filtro.</p>';
            } catch(e) {
                agendaFeed.innerHTML = '<p class="text-xs text-rose-500 text-center py-6">Erro ao carregar agenda.</p>';
            }
        }

        async function openDetailsModal(id, mediaType = 'movie') {
            const modal = document.getElementById('detailsModal');

            if (!modal || !content) return;
            modal.classList.remove('hidden'); modal.classList.add('flex');
