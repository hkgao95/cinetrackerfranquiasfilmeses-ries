                const res = await fetch(`https://api.themoviedb.org/3/${mediaType}/${id}?api_key=${getActiveApiKey()}&language=pt-BR`);
                const item = await res.json();
                currentDetailItem = { ...item, media_type: mediaType };

                let providerHTML = '';
                try {
                    const provRes = await fetch(`https://api.themoviedb.org/3/${mediaType}/${id}/watch/providers?api_key=${getActiveApiKey()}`);
                    const provData = await provRes.json();
                    const br = provData?.results?.BR;
                    if (br && (br.flatrate || br.rent || br.buy || br.free || br.ads)) {
                        const allProvs = [
                            ...(br.flatrate || []).map(p => ({ ...p, type: 'Streaming' })),
                            ...(br.rent || []).map(p => ({ ...p, type: 'Aluguel' })),
                            ...(br.buy || []).map(p => ({ ...p, type: 'Compra' }))
                        ];
                        providerHTML = `
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                ${allProvs.map(p => `
                                    <a href="${br.link || 'https://www.justwatch.com/br'}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 p-2.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl border border-zinc-700 transition group">
                                        <img src="https://image.tmdb.org/t/p/original${p.logo_path}" class="w-7 h-7 rounded-lg object-cover">
                                        <div class="overflow-hidden">
                                            <p class="text-xs font-bold text-zinc-100 truncate group-hover:text-purple-300 transition">${p.provider_name}</p>
                                            <p class="text-[10px] text-purple-400">${p.type}</p>
                                        </div>
                                    </a>
                                `).join('')}
                            </div>
                        `;
                    } else {
                        providerHTML = '<p class="text-xs text-zinc-400">Sem plataformas de streaming no momento no Brasil.</p>';
                    }
                } catch(e) {
                    providerHTML = '<p class="text-xs text-zinc-500">Indisponível.</p>';
                }

                const title = item.title || item.name || 'Sem Título';
                const year = (item.release_date || item.first_air_date || '').substring(0, 4);
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const overview = item.overview || 'Sem sinopse disponível.';
                const genres = (item.genres || []).map(g => g.name).join(', ');
                const runtime = mediaType === 'movie' ? `${item.runtime || 110} min` : `${item.number_of_seasons || 1} Temporadas`;
                const inQueue = state.pending.some(i => Number(i.id) === Number(id));

                content.innerHTML = `
                    <button onclick="closeDetailsModal()" class="absolute top-4 right-4 z-20 w-8 h-8 rounded-full bg-black/70 flex items-center justify-center text-zinc-300 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                    <div class="relative h-48 rounded-2xl overflow-hidden mb-4 bg-zinc-800">
                        ${item.backdrop_path ? `<img src="${formatBackdropUrl(item.backdrop_path)}" class="w-full h-full object-cover">` : ''}
                        <div class="absolute inset-0 bg-gradient-to-t from-zinc-900 via-zinc-900/40 to-transparent"></div>
                        <div class="absolute bottom-4 left-4 z-20 flex items-end gap-4">
                            <img src="${formatPosterUrl(item.poster_path)}" class="w-20 aspect-[2/3] rounded-xl object-cover shadow-xl border border-zinc-700 hidden sm:block">
                            <div>
                                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-purple-600 text-white">${mediaType === 'movie' ? 'Filme' : 'Série'}</span>
                                <h2 class="text-xl font-extrabold text-white mt-1">${title}</h2>
                                <p class="text-xs text-zinc-300 mt-1"><span class="text-amber-400 font-bold">★ ${rating}</span> • <span>${year}</span> • <span>${runtime}</span></p>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-4">
                        ${genres ? `<p class="text-xs font-semibold text-purple-400">Gêneros: ${genres}</p>` : ''}
                        <p class="text-xs sm:text-sm text-zinc-300 leading-relaxed">${overview}</p>
                        <div>
                            <h4 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2"><i class="fa-solid fa-tv text-purple-400 mr-1"></i> Onde Assistir no Brasil</h4>
                            ${providerHTML}
                        </div>
                        <div class="flex gap-3 pt-2">
                            <button onclick="togglePendingItemExplicit(${item.id}, '${mediaType}')" class="flex-1 py-3 rounded-2xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs transition shadow-lg">
                                ${inQueue ? 'Remover da Fila' : 'Adicionar à Fila'}
                            </button>
                            ${mediaType === 'tv' ? `<button onclick="openSeriesTrackerModal(${item.id})" class="flex-1 py-3 rounded-2xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold text-xs transition border border-zinc-700">Acompanhar Episódios</button>` : `<button onclick="markWatchedDirect(${item.id}, 'movie')" class="flex-1 py-3 rounded-2xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold text-xs transition border border-zinc-700">Marcar Visto</button>`}
                        </div>
                    </div>
                `;
            } catch(e) {
                content.innerHTML = '<p class="text-center text-xs text-rose-500 py-10">Erro ao carregar detalhes.</p>';
            }
        }

        async function openSeriesTrackerModal(tvId) {
            const modal = document.getElementById('detailsModal');
            const content = document.getElementById('detailsModalContent');
            if (!modal || !content) return;
            modal.classList.remove('hidden'); modal.classList.add('flex');
            content.innerHTML = '<div class="flex justify-center py-20"><i class="fa-solid fa-spinner fa-spin text-purple-500 text-3xl"></i></div>';

            try {
                let item = itemsCache.get(tvId);
                if (!item) {
                    const res = await fetch(`https://api.themoviedb.org/3/tv/${tvId}?api_key=${getActiveApiKey()}&language=pt-BR`);
                    item = await res.json();
                    itemsCache.set(tvId, { ...item, media_type: 'tv' });
                }

                const seasons = (item.seasons || []).filter(s => s.season_number > 0);
                if (!state.seriesProgress[tvId]) {
                    state.seriesProgress[tvId] = { watchedEpisodes: {}, currentSeason: seasons[0]?.season_number || 1 };
                }
                const progress = state.seriesProgress[tvId];
                let selectedSeasonNum = progress.currentSeason || seasons[0]?.season_number || 1;

                const renderSeasonEpisodes = async (sNum) => {
                    progress.currentSeason = sNum;
                    saveState();
                    const epContainer = document.getElementById('seasonEpisodesContainer');
                    if (!epContainer) return;
                    epContainer.innerHTML = '<div class="flex justify-center py-10"><i class="fa-solid fa-spinner fa-spin text-purple-500 text-xl"></i></div>';

                    try {
                        const sRes = await fetch(`https://api.themoviedb.org/3/tv/${tvId}/season/${sNum}?api_key=${getActiveApiKey()}&language=pt-BR`);
                        const seasonData = await sRes.json();
                        const episodes = seasonData.episodes || [];

                        epContainer.innerHTML = `
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs font-bold text-purple-400">Temporada ${sNum} (${episodes.length} Episódios)</span>
                                <button onclick="markSeasonCompleted(${tvId}, ${sNum}, ${episodes.length})" class="px-3 py-1 bg-purple-600/20 text-purple-300 hover:bg-purple-600 hover:text-white rounded-xl text-xs font-bold transition">Marcar Temporada Concluída</button>
                            </div>
                            <div class="space-y-2 max-h-72 overflow-y-auto no-scrollbar pr-1">
                                ${episodes.map(ep => {
                                    const epKey = `${sNum}_${ep.episode_number}`;
                                    const isWatched = !!progress.watchedEpisodes[epKey];
                                    return `
                                        <div class="bg-zinc-800/40 border border-zinc-700/50 rounded-xl p-3 flex flex-col gap-1">
                                            <div class="flex items-center justify-between">
                                                <div class="flex items-center gap-2">
                                                    <span class="w-6 h-6 rounded-full bg-zinc-700 text-white font-bold text-[10px] flex items-center justify-center">${ep.episode_number}</span>
                                                    <h5 class="text-xs font-bold text-zinc-100">${ep.name || `Episódio ${ep.episode_number}`}</h5>
                                                </div>
                                                <button onclick="toggleEpisodeWatched(${tvId}, ${sNum}, ${ep.episode_number})" class="px-3 py-1 rounded-lg text-xs font-bold transition ${isWatched ? 'bg-emerald-600/30 text-emerald-300 border border-emerald-500/40' : 'bg-zinc-700 text-zinc-300 hover:bg-zinc-600'}">
                                                    ${isWatched ? '✓ Visto' : 'Assistir'}
                                                </button>
                                            </div>
                                            <p class="text-[11px] text-zinc-400 leading-relaxed">${ep.overview || 'Sem resumo disponível.'}</p>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `;
                    } catch(e) {
                        epContainer.innerHTML = '<p class="text-xs text-rose-500 text-center py-4">Erro ao carregar episódios.</p>';
                    }
                };

                window.toggleEpisodeWatched = (tId, sNum, epNum) => {
                    const k = `${sNum}_${epNum}`;
                    if (state.seriesProgress[tId].watchedEpisodes[k]) {
                        delete state.seriesProgress[tId].watchedEpisodes[k];
                    } else {
                        state.seriesProgress[tId].watchedEpisodes[k] = true;
                        const watchedItem = {
                            id: `${tId}_s${sNum}e${epNum}`,
                            tvId: tId,
                            title: `${item.name || item.title} (S${sNum}E${epNum})`,
                            poster_path: item.poster_path,
                            rating: null,
                            media_type: 'tv'
                        };
                        if (!state.watched.some(w => w.id === watchedItem.id)) {
                            state.watched.push(watchedItem);
                        }
                    }
                    if (!state.pending.some(p => Number(p.id) === Number(tId))) {
                        state.pending.push({ ...item, media_type: 'tv' });
                    }
                    saveState();
                    renderSeasonEpisodes(sNum);
                    if (state.currentTab === 'pending') renderPendingQueue();
                };

                window.markSeasonCompleted = (tId, sNum, totalEps) => {
                    for (let i = 1; i <= totalEps; i++) {
                        state.seriesProgress[tId].watchedEpisodes[`${sNum}_${i}`] = true;
                    }
                    if (!state.pending.some(p => Number(p.id) === Number(tId))) {
                        state.pending.push({ ...item, media_type: 'tv' });
                    }
                    saveState();
                    renderSeasonEpisodes(sNum);
                    if (state.currentTab === 'pending') renderPendingQueue();
                    showToast(`Temporada ${sNum} concluída!`, 'success');
                };

                content.innerHTML = `
                    <button onclick="closeDetailsModal()" class="absolute top-4 right-4 z-20 w-8 h-8 rounded-full bg-black/70 flex items-center justify-center text-zinc-300 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                    <div class="space-y-4">
                        <div class="flex items-center gap-4">
                            <img src="${formatPosterUrl(item.poster_path)}" class="w-20 h-28 object-cover rounded-xl shadow-lg">
                            <div>
                                <span class="text-[10px] bg-purple-600/30 text-purple-300 px-2 py-0.5 rounded-full uppercase font-bold">Acompanhar Série</span>
                                <h2 class="text-base font-extrabold text-white mt-1">${item.name || item.title}</h2>
                                <p class="text-xs text-zinc-400 mt-1">${seasons.length} Temporadas disponíveis</p>
                            </div>
                        </div>
                        <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                            ${seasons.map(s => `
                                <button onclick="selectSeriesSeason(${tvId}, ${s.season_number})" id="seasonBtn_${s.season_number}" class="px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${s.season_number === selectedSeasonNum ? 'bg-purple-600 text-white shadow-lg' : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'}">
                                    Temporada ${s.season_number}
                                </button>
                            `).join('')}
                        </div>
                        <div id="seasonEpisodesContainer" class="bg-zinc-900/60 p-4 rounded-2xl border border-zinc-800"></div>
                        <div class="flex justify-end pt-2">
                            <button onclick="closeDetailsModal()" class="px-4 py-2 bg-zinc-800 text-zinc-300 hover:bg-zinc-700 font-bold text-xs rounded-xl">Concluir</button>
                        </div>
                    </div>
                `;

                window.selectSeriesSeason = (tId, sNum) => {
                    document.querySelectorAll('[id^="seasonBtn_"]').forEach(btn => btn.className = "px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap bg-zinc-800 text-zinc-300 hover:bg-zinc-700");
                    const activeBtn = document.getElementById(`seasonBtn_${sNum}`);
                    if (activeBtn) activeBtn.className = "px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap bg-purple-600 text-white shadow-lg";
                    renderSeasonEpisodes(sNum);
                };

                renderSeasonEpisodes(selectedSeasonNum);
            } catch(e) {
                content.innerHTML = '<p class="text-xs text-rose-500 text-center py-10">Erro ao carregar série.</p>';
            }
        }

        async function markWatchedDirect(id, mediaType) {
            try {
                if (mediaType === 'movie') {
                    const res = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${getActiveApiKey()}&language=pt-BR`);
                    const item = await res.json();
                    if (!state.watched.some(w => Number(w.id) === Number(id))) {
                        state.watched.push({
                            id: Number(id),
                            title: item.title || item.name,
                            poster_path: item.poster_path,
                            rating: null,
                            media_type: 'movie'
                        });
                    }
                    state.pending = state.pending.filter(p => Number(p.id) !== Number(id));
                    saveState();
                    showToast('Marcado como visto e removido da fila!', 'success');
                    if (state.currentTab === 'pending') renderPendingQueue();
                }
            } catch(e) {
                showToast('Erro ao marcar como visto.', 'error');
            }
        }

        async function markNextSeriesEpisodeDirect(tvId, seasonNum, epNum) {
            let item = itemsCache.get(tvId);
            if (!item) {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${tvId}?api_key=${getActiveApiKey()}&language=pt-BR`);
                item = await res.json();
                itemsCache.set(tvId, { ...item, media_type: 'tv' });
            }

            if (!state.seriesProgress[tvId]) {
                state.seriesProgress[tvId] = { watchedEpisodes: {}, currentSeason: seasonNum };
            }
            const prog = state.seriesProgress[tvId];
            
            const k = `${seasonNum}_${epNum}`;
            prog.watchedEpisodes[k] = true;

            const watchedItem = {
                id: `${tvId}_s${seasonNum}e${epNum}`,
                tvId: tvId,
                title: `${item.name || item.title} (T${seasonNum}E${epNum})`,
                poster_path: item.poster_path,
                rating: null,
                media_type: 'tv'
            };
            if (!state.watched.some(w => w.id === watchedItem.id)) {
                state.watched.push(watchedItem);
            }

            // Verifica se a temporada atual acabou para atualizar a currentSeason para a próxima
            try {
                const sRes = await fetch(`https://api.themoviedb.org/3/tv/${tvId}/season/${seasonNum}?api_key=${getActiveApiKey()}&language=pt-BR`);
                if (sRes.ok) {
                    const sData = await sRes.json();
                    const episodes = sData.episodes || [];
                    const seasonCompleted = episodes.every(e => prog.watchedEpisodes[`${seasonNum}_${e.episode_number}`]);
                    if (seasonCompleted) {
                        const seasonsList = item.seasons ? item.seasons.filter(s => s.season_number > 0) : [];
                        const nextSeasonObj = seasonsList.find(s => s.season_number > seasonNum);
                        if (nextSeasonObj) {
                            prog.currentSeason = nextSeasonObj.season_number;
                        }
                    }
                }
            } catch(e) {}

            const totalEps = item.number_of_episodes || 9999;
            const watchedCount = Object.keys(prog.watchedEpisodes).length;
            if (watchedCount >= totalEps) {
                state.pending = state.pending.filter(p => Number(p.id) !== Number(tvId));
                delete state.seriesProgress[tvId];
                showToast('Série concluída e removida da fila!', 'success');
            } else {
                if (!state.pending.some(p => Number(p.id) === Number(tvId))) {
                    state.pending.push({ ...item, media_type: 'tv' });
                }
                showToast(`T${seasonNum}:E${epNum} marcado como visto!`, 'success');
            }

            saveState();
            if (state.currentTab === 'pending') renderPendingQueue();
        }

        window.removeWatched = function(idx) {
            const removed = state.watched[idx];
            if (removed) {
                if (removed.tvId) {
                    const tvId = removed.tvId;
                    if (state.seriesProgress[tvId]) {
                        for (const key of Object.keys(state.seriesProgress[tvId].watchedEpisodes)) {
                            if (removed.id.includes(`s${key.replace('_','e')}`)) {
                                delete state.seriesProgress[tvId].watchedEpisodes[key];
                            }
                        }
                        if (Object.keys(state.seriesProgress[tvId].watchedEpisodes).length === 0) {
                            state.seriesProgress[tvId].currentSeason = 1;
                        }
                    }
                } else if (removed.id) {
                    const movieId = Number(removed.id);
                    if (!state.pending.some(p => Number(p.id) === movieId)) {
                        fetch(`https://api.themoviedb.org/3/movie/${movieId}?api_key=${getActiveApiKey()}&language=pt-BR`)
                            .then(res => res.json())
                            .then(movieData => {
                                if (movieData && movieData.id) {
                                    state.pending.push({
                                        ...movieData,
                                        media_type: 'movie',
                                        collection_id: movieData.belongs_to_collection?.id,
                                        collection_name: movieData.belongs_to_collection?.name
                                    });
                                    saveState();
                                    if (state.currentTab === 'pending') renderPendingQueue();
                                }
                            }).catch(() => {});
                    }
                }
            }
            state.watched.splice(idx, 1);
            saveState();
            renderWatched();
            if (state.currentTab === 'pending') renderPendingQueue();
            showToast('Removido do histórico.', 'info');
        };

        window.addEventListener('DOMContentLoaded', () => switchTab('explore'));
    </script>
</body>
</html>
